repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
# ruff replaces black here: it does both the formatting and the linting,
# and running both would ping-pong (they disagree on how to wrap a few
# conditional expressions). Rules + excludes live in pyproject.toml.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
