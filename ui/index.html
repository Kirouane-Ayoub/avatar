<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar — AI Voice Assistant</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs",
          "lipsync-en": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/lipsync-en.mjs",
          "lipsync-fr": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/lipsync-fr.mjs"
        }
      }
    </script>
    <script type="module">
      import { TalkingHead } from 'talkinghead';
      import { LipsyncEn } from 'lipsync-en';
      import { LipsyncFr } from 'lipsync-fr';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

      const origParse = GLTFLoader.prototype.parse;
      GLTFLoader.prototype.parse = function (...args) {
        try { this.setMeshoptDecoder(MeshoptDecoder); } catch {}
        return origParse.apply(this, args);
      };

      window.TalkingHead = TalkingHead;
      window.LipsyncEn = LipsyncEn;
      window.LipsyncFr = LipsyncFr;
      window.dispatchEvent(new Event('talkinghead-ready'));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
