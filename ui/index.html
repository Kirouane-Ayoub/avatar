<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lisa</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 480px;
      width: 100%;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 2rem;
    }
    #btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      position: relative;
      z-index: 2;
    }
    #btn:hover { border-color: #555; background: #222; }
    #btn.connected {
      border-color: #22c55e;
      background: #052e16;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
    }
    #btn.connecting {
      border-color: #eab308;
      background: #1a1500;
    }
    #status {
      font-size: 0.8rem;
      color: #666;
      min-height: 1.2rem;
    }
    .mic-select {
      margin-bottom: 1.5rem;
    }
    .mic-select select {
      background: #1a1a1a;
      color: #e5e5e5;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
      width: 100%;
      max-width: 300px;
      cursor: pointer;
      outline: none;
    }
    .mic-select select:hover { border-color: #555; }
    .mic-select label {
      display: block;
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 0.3rem;
    }

    /* Wave visualizer */
    .wave-wrap {
      position: relative;
      height: 100px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#waveCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .panel { display: none; }
    .panel.visible { display: block; }

    /* Transcript */
    .transcript-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      margin-bottom: 0.4rem;
    }
    .section-title {
      font-size: 0.7rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .clear-btn {
      background: none;
      border: 1px solid #333;
      color: #666;
      font-size: 0.65rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover { border-color: #555; color: #aaa; }
    .transcript {
      padding: 0.6rem;
      background: #111;
      border-radius: 8px;
      border: 1px solid #222;
      min-height: 60px;
      max-height: 220px;
      overflow-y: auto;
      text-align: left;
    }
    .msg {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      line-height: 1.5;
      font-size: 0.85rem;
    }
    .msg:last-child { margin-bottom: 0; }
    .msg.user {
      background: rgba(59, 130, 246, 0.08);
      border-left: 2px solid #3b82f6;
    }
    .msg.agent {
      background: rgba(34, 197, 94, 0.08);
      border-left: 2px solid #22c55e;
    }
    .msg .avatar {
      flex-shrink: 0;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 700;
      margin-top: 1px;
    }
    .msg.user .avatar { background: #1e3a5f; color: #93c5fd; }
    .msg.agent .avatar { background: #14532d; color: #86efac; }
    .msg .text { color: #d4d4d4; }
    .msg.user .text { color: #bfdbfe; }
    .msg.agent .text { color: #bbf7d0; }

    /* Metrics */
    .metrics {
      margin-top: 0.75rem;
      padding: 0.6rem 0.8rem;
      background: #111;
      border-radius: 8px;
      border: 1px solid #222;
      font-size: 0.75rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-align: left;
    }
    .metrics-row {
      display: flex;
      justify-content: space-between;
      padding: 0.15rem 0;
    }
    .metrics-label { color: #666; }
    .metrics-value { color: #888; font-weight: 600; }
    .metrics-value.good { color: #22c55e; }
    .metrics-value.ok { color: #eab308; }
    .metrics-value.slow { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lisa</h1>
    <p class="subtitle">Voice Assistant</p>
    <div class="wave-wrap">
      <canvas id="waveCanvas"></canvas>
    </div>
    <div class="mic-select">
      <label for="micSelect">Microphone</label>
      <select id="micSelect"><option value="">Loading devices...</option></select>
    </div>
    <button id="btn" onclick="toggle()">Connect</button>
    <div id="status"></div>
    <div class="panel" id="chatPanel">
      <div class="transcript-header">
        <span class="section-title">Conversation</span>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <div class="metrics" id="metricsPanel">
        <div class="section-title" style="margin-bottom:0.3rem">STT</div>
        <div class="metrics-row">
          <span class="metrics-label">Processing</span>
          <span class="metrics-value" id="m-stt-dur">--</span>
        </div>
        <div class="metrics-row">
          <span class="metrics-label">Audio in</span>
          <span class="metrics-value" id="m-stt-audio">--</span>
        </div>
        <div class="metrics-row">
          <span class="metrics-label">Transcription</span>
          <span class="metrics-value" id="m-stt-trans">--</span>
        </div>

        <div class="section-title" style="margin-top:0.5rem; margin-bottom:0.3rem">LLM</div>
        <div class="metrics-row">
          <span class="metrics-label">TTFT</span>
          <span class="metrics-value" id="m-llm-ttft">--</span>
        </div>

        <div class="section-title" style="margin-top:0.5rem; margin-bottom:0.3rem">TTS</div>
        <div class="metrics-row">
          <span class="metrics-label">TTFB</span>
          <span class="metrics-value" id="m-tts-ttfb">--</span>
        </div>
        <div class="metrics-row">
          <span class="metrics-label">Synthesis</span>
          <span class="metrics-value" id="m-tts-dur">--</span>
        </div>
        <div class="metrics-row">
          <span class="metrics-label">Audio out</span>
          <span class="metrics-value" id="m-tts-audio">--</span>
        </div>
        <div class="metrics-row">
          <span class="metrics-label">Characters</span>
          <span class="metrics-value" id="m-tts-chars">--</span>
        </div>

        <div style="border-top:1px solid #222; margin-top:0.4rem; padding-top:0.3rem">
          <div class="section-title" style="margin-bottom:0.3rem">Pipeline</div>
          <div class="metrics-row">
            <span class="metrics-label">End-to-end</span>
            <span class="metrics-value" id="m-e2e">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TOKEN_URL = '/api/token';

    const btn = document.getElementById('btn');
    const statusEl = document.getElementById('status');
    const transcript = document.getElementById('transcript');
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    const micSelect = document.getElementById('micSelect');

    let room = null;
    let connected = false;
    let audioContext = null;
    let agentAnalyser = null;
    let micAnalyser = null;
    let animationId = null;

    // Populate microphone list
    async function loadMicDevices() {
      try {
        // Need a brief getUserMedia call to get device labels
        const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        tempStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter(d => d.kind === 'audioinput');
        micSelect.innerHTML = '';
        mics.forEach((mic, i) => {
          const opt = document.createElement('option');
          opt.value = mic.deviceId;
          opt.textContent = mic.label || `Microphone ${i + 1}`;
          micSelect.appendChild(opt);
        });
      } catch {
        micSelect.innerHTML = '<option value="">Mic access denied</option>';
      }
    }
    loadMicDevices();

    // Refresh list when devices change (plug/unplug)
    navigator.mediaDevices.addEventListener('devicechange', loadMicDevices);

    // Resize canvas to match CSS size
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    async function toggle() {
      if (connected) disconnect();
      else await connect();
    }

    async function connect() {
      btn.className = 'connecting';
      btn.textContent = 'Connecting...';
      statusEl.textContent = 'Fetching token...';

      try {
        const res = await fetch(TOKEN_URL);
        const data = await res.json();

        room = new LivekitClient.Room({
          audioCaptureDefaults: { autoGainControl: true, noiseSuppression: true },
        });

        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
          if (track.kind === 'audio') {
            const el = track.attach();
            el.style.display = 'none';
            document.body.appendChild(el);
            setupAgentVisualizer(el);
          }
        });

        room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
          track.detach().forEach(el => el.remove());
        });

        room.on(LivekitClient.RoomEvent.Disconnected, () => disconnect());

        room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
          if (topic !== 'metrics') return;
          try {
            const d = JSON.parse(new TextDecoder().decode(payload));

            if (d.type === 'stt') {
              setMetric('m-stt-dur', d.duration_ms, 'ms', 300, 600);
              setMs('m-stt-audio', d.audio_duration_ms);
            } else if (d.type === 'tts') {
              setMetric('m-tts-ttfb', d.ttfb_ms, 'ms', 200, 500);
              setMetric('m-tts-dur', d.duration_ms, 'ms', 500, 1000);
              setMs('m-tts-audio', d.audio_duration_ms);
              setText('m-tts-chars', d.characters);
            } else if (d.type === 'pipeline') {
              if (d.transcription_ms) setMetric('m-stt-trans', d.transcription_ms, 'ms', 200, 500);
              if (d.llm_ttft_ms) setMetric('m-llm-ttft', d.llm_ttft_ms, 'ms', 300, 800);
              if (d.tts_ttfb_ms) setMetric('m-tts-ttfb', d.tts_ttfb_ms, 'ms', 200, 500);
              if (d.e2e_ms) setMetric('m-e2e', d.e2e_ms, 'ms', 800, 1500);
            }
          } catch {}
        });

        room.on(LivekitClient.RoomEvent.TranscriptionReceived, (segments, participant) => {
          for (const seg of segments) {
            if (!seg.text) continue;
            const isAgent = participant?.identity !== 'user';
            const role = isAgent ? 'agent' : 'user';
            const existingEl = document.getElementById('seg-' + seg.id);
            if (existingEl) {
              existingEl.querySelector('.text').textContent = seg.text;
            } else {
              addTranscript(role, seg.text, seg.id);
            }
          }
        });

        statusEl.textContent = 'Connecting to room...';
        await room.connect(data.url, data.token);
        const selectedDeviceId = micSelect.value;
        await room.localParticipant.setMicrophoneEnabled(true, {
          deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
        });

        // Set up mic visualizer
        setupMicVisualizer();

        connected = true;
        btn.className = 'connected';
        btn.textContent = 'Disconnect';
        statusEl.textContent = 'Connected — speak to the agent';
        document.getElementById('chatPanel').classList.add('visible');
        startVisualizerLoop();

      } catch (err) {
        btn.className = '';
        btn.textContent = 'Connect';
        statusEl.textContent = 'Error: ' + err.message;
        console.error(err);
      }
    }

    function disconnect() {
      if (room) { room.disconnect(); room = null; }
      if (animationId) cancelAnimationFrame(animationId);
      if (audioContext) audioContext.close();
      audioContext = null;
      agentAnalyser = null;
      micAnalyser = null;
      connected = false;
      btn.className = '';
      btn.textContent = 'Connect';
      statusEl.textContent = 'Disconnected';
      document.getElementById('chatPanel').classList.remove('visible');
      // Clear canvas
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
    }

    function setupAgentVisualizer(audioEl) {
      if (!audioContext) audioContext = new AudioContext();
      const source = audioContext.createMediaElementSource(audioEl);
      agentAnalyser = audioContext.createAnalyser();
      agentAnalyser.fftSize = 256;
      agentAnalyser.smoothingTimeConstant = 0.7;
      source.connect(agentAnalyser);
      agentAnalyser.connect(audioContext.destination);
    }

    function setupMicVisualizer() {
      if (!audioContext) audioContext = new AudioContext();
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        const source = audioContext.createMediaStreamSource(stream);
        micAnalyser = audioContext.createAnalyser();
        micAnalyser.fftSize = 256;
        micAnalyser.smoothingTimeConstant = 0.7;
        source.connect(micAnalyser);
        // Don't connect to destination (would cause feedback)
      }).catch(() => {});
    }

    function startVisualizerLoop() {
      const agentData = new Uint8Array(128);
      const micData = new Uint8Array(128);

      function draw() {
        animationId = requestAnimationFrame(draw);

        const w = canvas.parentElement.getBoundingClientRect().width;
        const h = canvas.parentElement.getBoundingClientRect().height;

        // Reset transform and clear
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        ctx.clearRect(0, 0, w, h);

        // Get frequency data
        let agentLevel = 0;
        let micLevel = 0;

        if (agentAnalyser) {
          agentAnalyser.getByteFrequencyData(agentData);
          for (let i = 0; i < agentData.length; i++) agentLevel += agentData[i];
          agentLevel = agentLevel / agentData.length / 255;
        }

        if (micAnalyser) {
          micAnalyser.getByteFrequencyData(micData);
          for (let i = 0; i < micData.length; i++) micLevel += micData[i];
          micLevel = micLevel / micData.length / 255;
        }

        const time = performance.now() / 1000;
        const cx = w / 2;
        const cy = h / 2;

        // Draw agent wave (green, center)
        drawWave(cx, cy, w, h, agentLevel, time, '#22c55e', 0.4, 3);
        drawWave(cx, cy, w, h, agentLevel, time, '#16a34a', 0.25, 2);

        // Draw mic wave (blue, subtle)
        drawWave(cx, cy, w, h, micLevel, time * 1.3, '#3b82f6', 0.2, 2);
      }

      draw();
    }

    function drawWave(cx, cy, w, h, level, time, color, baseAlpha, lineWidth) {
      const numPoints = 80;
      const amplitude = Math.max(2, level * h * 0.45);

      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.globalAlpha = baseAlpha + level * 0.6;

      for (let i = 0; i <= numPoints; i++) {
        const x = (i / numPoints) * w;
        const normX = (i / numPoints) * 2 - 1; // -1 to 1

        // Envelope: fade out at edges
        const envelope = 1 - normX * normX;

        // Multiple sine waves for organic feel
        const y = cy
          + Math.sin(normX * 4 + time * 3) * amplitude * envelope * 0.5
          + Math.sin(normX * 7 - time * 2.5) * amplitude * envelope * 0.3
          + Math.sin(normX * 11 + time * 4) * amplitude * envelope * 0.2;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function addTranscript(role, text, segId) {
      const div = document.createElement('div');
      if (segId) div.id = 'seg-' + segId;
      div.className = 'msg ' + role;
      const av = role === 'user' ? 'U' : 'A';
      div.innerHTML = `<span class="avatar">${av}</span><span class="text">${text}</span>`;
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function clearChat() {
      transcript.innerHTML = '';
    }

    function setMetric(id, val, suffix, goodT, okT) {
      const el = document.getElementById(id);
      if (!el || val == null) return;
      el.textContent = val + suffix;
      el.className = 'metrics-value ' + (val <= goodT ? 'good' : val <= okT ? 'ok' : 'slow');
    }

    function setMs(id, val) {
      const el = document.getElementById(id);
      if (!el || val == null) return;
      el.textContent = val >= 1000 ? (val / 1000).toFixed(1) + 's' : val + 'ms';
      el.className = 'metrics-value';
    }

    function setText(id, val) {
      const el = document.getElementById(id);
      if (!el || val == null) return;
      el.textContent = val;
      el.className = 'metrics-value';
    }
  </script>
</body>
</html>
