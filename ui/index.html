<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRO - AI Voice Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
  } }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #09090b;
      color: #e4e4e7;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Left: Avatar ── */
    .avatar-side {
      flex: 0 0 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0f0a1a 0%, #09090b 50%, #0a0d12 100%);
      position: relative;
      border-right: 1px solid #1a1a2e;
    }
    #avatar {
      width: 420px;
      height: 500px;
      border-radius: 20px;
      overflow: hidden;
      background: transparent;
    }
    #avatar canvas { border-radius: 20px; }
    #avatarMsg {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: #666;
      background: rgba(0,0,0,0.7);
      padding: 4px 14px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    .avatar-label {
      position: absolute;
      bottom: 40px;
      text-align: center;
    }
    .avatar-label h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .avatar-label p {
      font-size: 0.65rem;
      color: #52525b;
      margin-top: 2px;
    }

    /* Ambient glow behind avatar */
    .avatar-side::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(124,58,237,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      pointer-events: none;
    }

    /* ── Right: Panel ── */
    .panel-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2rem 2.5rem;
      min-width: 0;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #18181b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,0.5);
    }
    .brand-dot.offline { background: #52525b; box-shadow: none; }
    .brand h1 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #a1a1aa;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .connect-btn {
      padding: 0.45rem 1.4rem;
      border-radius: 8px;
      border: 1px solid #27272a;
      background: #18181b;
      color: #e4e4e7;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .connect-btn:hover { background: #27272a; border-color: #3f3f46; }
    .connect-btn.connected {
      background: #052e16;
      border-color: #22c55e;
      color: #86efac;
    }
    .connect-btn.connecting {
      background: #1a1500;
      border-color: #eab308;
      color: #fde047;
    }

    /* Status */
    .status-bar {
      font-size: 0.68rem;
      color: #52525b;
      margin-bottom: 1.2rem;
      min-height: 1rem;
    }

    /* Mic select */
    .mic-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .mic-bar label {
      font-size: 0.65rem;
      color: #52525b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
    }
    .mic-bar select {
      flex: 1;
      background: #18181b;
      color: #a1a1aa;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.72rem;
      font-family: inherit;
      outline: none;
      max-width: 320px;
    }
    .mic-bar select:hover { border-color: #3f3f46; }

    /* Avatar controls */
    .avatar-controls {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .ctrl-group {
      display: flex;
      gap: 0.25rem;
      align-items: center;
      background: #111114;
      border: 1px solid #1c1c22;
      border-radius: 8px;
      padding: 0.3rem 0.5rem;
    }
    .ctrl-label {
      font-size: 0.55rem;
      color: #3f3f46;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      margin-right: 0.3rem;
    }
    .ctrl-btn {
      background: #18181b;
      border: 1px solid #27272a;
      color: #71717a;
      font-size: 0.6rem;
      font-family: inherit;
      padding: 0.2rem 0.5rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .ctrl-btn:hover { background: #27272a; border-color: #3f3f46; color: #e4e4e7; }
    .ctrl-btn.active { background: #1e1b4b; border-color: #6366f1; color: #a5b4fc; }

    /* Conversation */
    .chat-section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .chat-title {
      font-size: 0.65rem;
      color: #3f3f46;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .clear-btn {
      background: none;
      border: 1px solid #27272a;
      color: #52525b;
      font-size: 0.6rem;
      font-family: inherit;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clear-btn:hover { border-color: #3f3f46; color: #a1a1aa; }

    .chat {
      flex: 1;
      background: #0f0f12;
      border: 1px solid #1c1c22;
      border-radius: 12px;
      padding: 0.8rem;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .chat::-webkit-scrollbar { width: 4px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }

    .msg {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
      max-width: 80%;
      animation: msgIn 0.2s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg:last-child { margin-bottom: 0; }
    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg.agent {
      align-self: flex-start;
      flex-direction: row;
    }
    .msg .bubble {
      padding: 0.45rem 0.7rem;
      border-radius: 12px;
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .msg.user .bubble {
      background: #172554;
      border-bottom-right-radius: 4px;
    }
    .msg.agent .bubble {
      background: #052e16;
      border-bottom-left-radius: 4px;
    }
    .msg .av {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: 700;
      margin-top: auto;
    }
    .msg.user .av { background: #1e3a5f; color: #60a5fa; }
    .msg.agent .av { background: #14532d; color: #4ade80; }
    .msg.user .t { color: #bfdbfe; }
    .msg.agent .t { color: #bbf7d0; }

    /* Empty state */
    .chat-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #27272a;
      font-size: 0.75rem;
    }

    /* Metrics */
    .metrics-bar {
      display: flex;
      gap: 1.2rem;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid #18181b;
    }
    .metric {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .metric-label {
      font-size: 0.55rem;
      color: #3f3f46;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .metric-value {
      font-size: 0.72rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #52525b;
      font-weight: 600;
    }
    .metric-value.good { color: #22c55e; }
    .metric-value.ok { color: #eab308; }
    .metric-value.slow { color: #ef4444; }

    /* Camera preview */
    .cam-preview {
      position: absolute;
      bottom: 80px;
      right: 16px;
      width: 120px;
      height: 90px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #27272a;
      background: #000;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: opacity 0.3s;
    }
    .cam-preview.visible { display: block; }
    .cam-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .cam-preview-label {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 0.45rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .cam-preview-dot {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239,68,68,0.6);
      animation: camPulse 2s ease-in-out infinite;
    }
    @keyframes camPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Setup Overlay ── */
    .setup-overlay {
      position: fixed;
      inset: 0;
      background: #09090b;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s, visibility 0.4s;
    }
    .setup-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .setup-card {
      background: #111114;
      border: 1px solid #1c1c22;
      border-radius: 16px;
      padding: 2rem 2.5rem;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .setup-card h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.3rem;
      text-align: center;
    }
    .setup-card .setup-sub {
      font-size: 0.7rem;
      color: #52525b;
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .setup-field {
      margin-bottom: 1.2rem;
    }
    .setup-field label {
      display: block;
      font-size: 0.65rem;
      color: #52525b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .setup-field select {
      width: 100%;
      background: #18181b;
      color: #a1a1aa;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 0.5rem 0.7rem;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
    }
    .setup-field select:hover { border-color: #3f3f46; }
    .char-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .char-opt {
      background: #18181b;
      border: 1px solid #27272a;
      color: #a1a1aa;
      border-radius: 10px;
      padding: 0.6rem 0.7rem;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.15rem;
      transition: all 0.15s;
    }
    .char-opt:hover { border-color: #3f3f46; background: #1c1c22; }
    .char-opt.active {
      border-color: #6366f1;
      background: #1e1b4b;
      color: #c7d2fe;
    }
    .char-opt .char-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
    }
    .char-opt.active .char-name { color: #e0e7ff; }
    .char-opt .char-sub {
      font-size: 0.6rem;
      color: #52525b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .setup-cam-preview {
      width: 100%;
      height: 160px;
      border-radius: 10px;
      overflow: hidden;
      background: #0a0a0a;
      border: 1px solid #27272a;
      margin-top: 0.5rem;
      position: relative;
    }
    .setup-cam-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .setup-cam-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #27272a;
      font-size: 0.7rem;
    }
    .setup-cam-toggle {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }
    .setup-cam-toggle label { margin-bottom: 0; }
    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }
    .toggle-switch input { display: none; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #27272a;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: #22c55e; }
    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: left 0.2s;
    }
    .toggle-switch input:checked ~ .toggle-thumb { left: 18px; }
    .setup-start {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    .setup-start:hover { opacity: 0.9; }
    .setup-start:active { transform: scale(0.98); }

    /* Responsive */
    @media (max-width: 900px) {
      .app { flex-direction: column; }
      .avatar-side {
        flex: 0 0 280px;
        border-right: none;
        border-bottom: 1px solid #1a1a2e;
      }
      #avatar { width: 240px; height: 280px; }
      .avatar-label { bottom: 10px; }
      .panel-side { padding: 1rem 1.5rem; }
    }
  </style>
</head>
<body>
  <!-- Setup Overlay -->
  <div class="setup-overlay" id="setupOverlay">
    <div class="setup-card">
      <h2>Pick your companion</h2>
      <p class="setup-sub">Configure before starting the session</p>

      <div class="setup-field">
        <label>Character</label>
        <div class="char-picker" id="charPicker">
          <button type="button" class="char-opt active" data-char="lisa">
            <span class="char-name">Lisa</span>
            <span class="char-sub">female · warm</span>
          </button>
          <button type="button" class="char-opt" data-char="max">
            <span class="char-name">Max</span>
            <span class="char-sub">male · laid-back</span>
          </button>
        </div>
      </div>

      <div class="setup-field">
        <label>Microphone</label>
        <select id="setupMic"><option>Loading...</option></select>
      </div>

      <div class="setup-field">
        <label>Camera</label>
        <select id="setupCam"><option>Loading...</option></select>
        <div class="setup-cam-toggle">
          <label class="toggle-switch">
            <input type="checkbox" id="setupCamToggle">
            <span class="toggle-track"></span>
            <span class="toggle-thumb"></span>
          </label>
          <span style="font-size:0.68rem; color:#71717a;">Enable camera</span>
        </div>
        <div class="setup-cam-preview" id="setupCamPreview">
          <span class="setup-cam-placeholder" id="setupCamPlaceholder">Camera off</span>
          <video id="setupCamVideo" autoplay muted playsinline></video>
        </div>
      </div>

      <button class="setup-start" id="setupStart">Start Session</button>
    </div>
  </div>

  <div class="app" style="display:none" id="mainApp">
    <!-- Left: Avatar -->
    <div class="avatar-side">
      <div id="avatar"><span id="avatarMsg">Click Connect to start</span></div>
      <div class="cam-preview" id="camPreview">
        <video id="camVideo" autoplay muted playsinline></video>
        <span class="cam-preview-label">You</span>
        <span class="cam-preview-dot"></span>
      </div>
      <div class="avatar-label">
        <h2 id="charName">Lisa</h2>
        <p>AI Voice Assistant</p>
      </div>
    </div>

    <!-- Right: Panel -->
    <div class="panel-side">
      <div class="header">
        <div class="brand">
          <div class="brand-dot offline" id="dot"></div>
          <h1 id="brandName">Lisa</h1>
        </div>
        <button class="connect-btn" id="btn" onclick="toggle()">Connect</button>
      </div>

      <div class="status-bar" id="status"></div>

      <div class="avatar-controls">
        <div class="ctrl-group">
          <span class="ctrl-label">View</span>
          <button class="ctrl-btn" onclick="setAvatarView('head')">Face</button>
          <button class="ctrl-btn" onclick="setAvatarView('upper')">Upper</button>
          <button class="ctrl-btn" onclick="setAvatarView('mid')">Mid</button>
          <button class="ctrl-btn active" onclick="setAvatarView('full')">Full</button>
        </div>
      </div>

      <div class="chat-section">
        <div class="chat-header">
          <span class="chat-title">Conversation</span>
          <button class="clear-btn" onclick="clearChat()">Clear</button>
        </div>
        <div class="chat" id="transcript">
          <div class="chat-empty" id="emptyState">Start a conversation</div>
        </div>
        <div class="metrics-bar">
          <div class="metric">
            <span class="metric-label">STT</span>
            <span class="metric-value" id="m-stt">--</span>
          </div>
          <div class="metric">
            <span class="metric-label">LLM</span>
            <span class="metric-value" id="m-llm">--</span>
          </div>
          <div class="metric">
            <span class="metric-label">TTS</span>
            <span class="metric-value" id="m-tts">--</span>
          </div>
          <div class="metric">
            <span class="metric-label">End-to-End</span>
            <span class="metric-value" id="m-e2e">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { TalkingHead } from "talkinghead";

    const TOKEN_URL = '/api/token';
    const btn = document.getElementById('btn');
    const dot = document.getElementById('dot');
    const statusEl = document.getElementById('status');
    const transcript = document.getElementById('transcript');
    const emptyState = document.getElementById('emptyState');
    const avatarMsg = document.getElementById('avatarMsg');

    // Setup elements
    const setupOverlay = document.getElementById('setupOverlay');
    const setupMic = document.getElementById('setupMic');
    const setupCam = document.getElementById('setupCam');
    const setupCamToggle = document.getElementById('setupCamToggle');
    const setupCamVideo = document.getElementById('setupCamVideo');
    const setupCamPlaceholder = document.getElementById('setupCamPlaceholder');
    const charPicker = document.getElementById('charPicker');

    // Characters must match ALLOWED_CHARACTERS in ui/server.py and
    // CHARACTERS in src/agent.py (same keys → same voice/name mapping).
    const CHARACTERS = {
      lisa: { name: 'Lisa', glb: './brunette.glb', body: 'F', mood: 'happy' },
      max:  { name: 'Max',  glb: './vroid.glb',    body: 'M', mood: 'neutral' },
    };
    let selectedChar = 'lisa';

    let room = null, connected = false, head = null;
    let cueArrived = false;       // true if agent emitted [mood:X]/[gesture:Y] this turn
    let lastAgentTextAt = 0;      // ms timestamp of last agent transcription (for idle gestures)
    let selectedMicId = null, selectedCamId = null, cameraWanted = false;
    let setupPreviewStream = null;

    // Character picker
    charPicker.addEventListener('click', (e) => {
      const btn = e.target.closest('.char-opt');
      if (!btn) return;
      selectedChar = btn.dataset.char;
      charPicker.querySelectorAll('.char-opt').forEach(b =>
        b.classList.toggle('active', b === btn));
    });

    // ── Avatar ──
    async function loadAvatar() {
      try {
        const cfg = CHARACTERS[selectedChar] || CHARACTERS.lisa;
        // Reflect the chosen name in the UI
        document.getElementById('charName').textContent = cfg.name;
        document.getElementById('brandName').textContent = cfg.name;
        document.title = `${cfg.name} - AI Voice Assistant`;

        head = new TalkingHead(document.getElementById('avatar'), {
          ttsEndpoint: null,
          cameraView: 'upper',
          cameraRotateEnable: true,
          lipsyncModules: ['en'],
        });
        avatarMsg.textContent = 'Loading 3D model...';

        await head.showAvatar({
          url: cfg.glb,
          body: cfg.body,
          avatarMood: cfg.mood,
          lipsyncLang: 'en',
        }, (ev) => {
          if (ev.lengthComputable) {
            avatarMsg.textContent = `Loading... ${Math.round(ev.loaded / ev.total * 100)}%`;
          }
        });

        avatarMsg.style.display = 'none';
        head.setMood(cfg.mood);
        head.setView('full');
      } catch (err) {
        console.error('Avatar error:', err);
        avatarMsg.textContent = 'Avatar failed to load';
      }
    }



    // ── Setup: load devices into popup ──
    async function loadSetupDevices() {
      try {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        s.getTracks().forEach(t => t.stop());
      } catch {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio: true });
          s.getTracks().forEach(t => t.stop());
        } catch {}
      }

      const devs = await navigator.mediaDevices.enumerateDevices();

      setupMic.innerHTML = '';
      devs.filter(d => d.kind === 'audioinput').forEach((m, i) => {
        const o = document.createElement('option');
        o.value = m.deviceId;
        o.textContent = m.label || `Microphone ${i+1}`;
        setupMic.appendChild(o);
      });

      setupCam.innerHTML = '';
      devs.filter(d => d.kind === 'videoinput').forEach((c, i) => {
        const o = document.createElement('option');
        o.value = c.deviceId;
        o.textContent = c.label || `Camera ${i+1}`;
        setupCam.appendChild(o);
      });
    }
    loadSetupDevices();

    // Camera preview toggle in setup
    setupCamToggle.addEventListener('change', async () => {
      if (setupCamToggle.checked) {
        try {
          const deviceId = setupCam.value;
          setupPreviewStream = await navigator.mediaDevices.getUserMedia({
            video: deviceId ? { deviceId: { exact: deviceId } } : true,
          });
          setupCamVideo.srcObject = setupPreviewStream;
          setupCamPlaceholder.style.display = 'none';
        } catch (err) {
          setupCamToggle.checked = false;
          setupCamPlaceholder.textContent = 'Camera error';
        }
      } else {
        if (setupPreviewStream) {
          setupPreviewStream.getTracks().forEach(t => t.stop());
          setupPreviewStream = null;
        }
        setupCamVideo.srcObject = null;
        setupCamPlaceholder.style.display = 'flex';
        setupCamPlaceholder.textContent = 'Camera off';
      }
    });

    // Switch camera preview when selection changes
    setupCam.addEventListener('change', () => {
      if (setupCamToggle.checked) {
        setupCamToggle.checked = false;
        setupCamToggle.dispatchEvent(new Event('change'));
        setTimeout(() => {
          setupCamToggle.checked = true;
          setupCamToggle.dispatchEvent(new Event('change'));
        }, 100);
      }
    });

    // Start session button
    document.getElementById('setupStart').addEventListener('click', async () => {
      selectedMicId = setupMic.value;
      selectedCamId = setupCam.value;
      cameraWanted = setupCamToggle.checked;

      // Stop preview stream
      if (setupPreviewStream) {
        setupPreviewStream.getTracks().forEach(t => t.stop());
        setupPreviewStream = null;
      }

      // Fade out setup, show main app
      setupOverlay.classList.add('hidden');
      document.getElementById('mainApp').style.display = 'flex';

      // Load avatar (now after user gesture — no AudioContext issue)
      await loadAvatar();

      // Auto-connect
      await connect();
    });

    // ── Connection ──
    window.toggle = () => { connected ? disconnect() : connect(); };

    async function connect() {
      btn.className = 'connect-btn connecting';
      btn.textContent = 'Connecting...';
      statusEl.textContent = 'Establishing connection...';
      try {
        const data = await (await fetch(`${TOKEN_URL}?character=${encodeURIComponent(selectedChar)}`)).json();
        room = new LivekitClient.Room({
          audioCaptureDefaults: { autoGainControl: true, noiseSuppression: true },
        });

        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === 'audio') handleAgentAudio(track);
        });
        room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
          track.detach().forEach(el => el.remove());
        });
        room.on(LivekitClient.RoomEvent.Disconnected, () => disconnect());

        room.on(LivekitClient.RoomEvent.DataReceived, (payload, p, k, topic) => {
          if (topic !== 'metrics') return;
          try {
            const d = JSON.parse(new TextDecoder().decode(payload));
            if (d.type === 'stt') setM('m-stt', d.duration_ms, 300, 600);
            else if (d.type === 'tts') setM('m-tts', d.ttfb_ms, 200, 500);
            else if (d.type === 'lipsync') queueLipsync(d);
            else if (d.type === 'mood') { if (head && d.value) setMood(d.value); cueArrived = true; }
            else if (d.type === 'gesture') { if (head && d.value) doGesture(d.value); cueArrived = true; }
            else if (d.type === 'pose') { if (head && d.value) doPose(d.value); cueArrived = true; }
            else if (d.type === 'pipeline') {
              if (d.llm_ttft_ms) setM('m-llm', d.llm_ttft_ms, 300, 800);
              if (d.tts_ttfb_ms) setM('m-tts', d.tts_ttfb_ms, 200, 500);
              if (d.e2e_ms) setM('m-e2e', d.e2e_ms, 800, 1500);
              if (d.transcription_ms) setM('m-stt', d.transcription_ms, 200, 500);
            }
          } catch {}
        });

        room.on(LivekitClient.RoomEvent.TranscriptionReceived, (segments, participant) => {
          for (const seg of segments) {
            if (!seg.text) continue;
            const isAgent = participant?.identity !== 'user';
            const role = isAgent ? 'agent' : 'user';

            // Strip [mood:X]/[gesture:Y]/[pose:Z] cue tags from displayed text
            const cleanText = isAgent
              ? seg.text.replace(/\[\s*(mood|gesture|pose)\s*:\s*[a-zA-Z_]+\s*\]\s*/gi, '')
              : seg.text;

            // Auto mood + gesture from Lisa's responses (fallback when she
            // didn't emit an explicit [mood:X]/[gesture:Y] cue this turn)
            if (isAgent && head) {
              lastAgentTextAt = Date.now();
              if (!cueArrived) {
                const mood = detectMood(cleanText);
                if (mood) setMood(mood);
                const gesture = detectGesture(cleanText);
                if (gesture) doGesture(gesture);
              }
              if (seg.final) cueArrived = false;
            }

            const el = document.getElementById('seg-' + seg.id);
            if (el) el.querySelector('.t').textContent = cleanText;
            else addMsg(role, cleanText, seg.id);
          }
        });

        await room.connect(data.url, data.token);
        await room.localParticipant.setMicrophoneEnabled(true, {
          deviceId: selectedMicId ? { exact: selectedMicId } : undefined,
        });

        // Enable camera if user chose to in setup
        if (cameraWanted) {
          await room.localParticipant.setCameraEnabled(true, {
            deviceId: selectedCamId ? { exact: selectedCamId } : undefined,
          });
          // Show camera preview on avatar side
          const camTrack = room.localParticipant.getTrackPublication('camera');
          if (camTrack && camTrack.track) {
            document.getElementById('camVideo').srcObject = new MediaStream([camTrack.track.mediaStreamTrack]);
          }
          document.getElementById('camPreview').classList.add('visible');
        }

        connected = true;
        btn.className = 'connect-btn connected';
        btn.textContent = 'Disconnect';
        dot.className = 'brand-dot';
        const charName = (CHARACTERS[selectedChar] || CHARACTERS.lisa).name;
        statusEl.textContent = cameraWanted
          ? `Connected — ${charName} can see and hear you`
          : `Connected — speak to ${charName}`;
      } catch (err) {
        btn.className = 'connect-btn';
        btn.textContent = 'Connect';
        statusEl.textContent = 'Error: ' + err.message;
      }
    }

    function disconnect() {
      if (room) { room.disconnect(); room = null; }
      connected = false;
      btn.className = 'connect-btn';
      btn.textContent = 'Connect';
      dot.className = 'brand-dot offline';
      statusEl.textContent = '';
      // Clear chat
      transcript.innerHTML = '<div class="chat-empty">Start a conversation</div>';
      lipSyncTimers.forEach(t => clearTimeout(t));
      lipSyncTimers = [];
      lipsyncQueue = [];
      if (agentAudioCtx) { try { agentAudioCtx.close(); } catch {} agentAudioCtx = null; }
      agentAnalyser = null;
      if (head) {
        head.setValue('jawOpen', 0);
        allVis.forEach(v => head.setValue('viseme_' + v, 0));
      }
      document.getElementById('camPreview').classList.remove('visible');
    }

    // ── Lip sync ──
    let lipSyncTimers = [];
    let lipsyncQueue = []; // queued lipsync data waiting for audio
    let agentAudioCtx = null;
    let agentAnalyser = null;
    let waitingForAudio = false;

    const charViseme = {
      'a':'aa','e':'E','i':'I','o':'O','u':'U',
      'b':'PP','p':'PP','m':'PP',
      'f':'FF','v':'FF',
      't':'DD','d':'DD','n':'nn','l':'nn',
      's':'SS','z':'SS','c':'SS',
      'r':'RR','k':'kk','g':'kk',
      'w':'U','y':'I','h':'sil',
    };
    const allVis = ['sil','PP','FF','TH','DD','kk','CH','SS','nn','RR','aa','E','I','O','U'];

    function handleAgentAudio(track) {
      const el = track.attach();
      el.style.display = 'none';
      document.body.appendChild(el);

      if (!head) return;

      // Monitor audio to drive lipsync in real-time
      const stream = new MediaStream([track.mediaStreamTrack]);
      agentAudioCtx = new AudioContext();
      const source = agentAudioCtx.createMediaStreamSource(stream);
      agentAnalyser = agentAudioCtx.createAnalyser();
      agentAnalyser.fftSize = 256;
      agentAnalyser.smoothingTimeConstant = 0.3;
      source.connect(agentAnalyser);

      const freqData = new Uint8Array(agentAnalyser.frequencyBinCount);

      // State for continuous lipsync playback
      let currentData = null;    // current lipsync being played
      let playStartTime = 0;     // when audio started (performance.now)
      let wordIdx = 0;           // current word index
      let charIdx = 0;           // current char within word
      let lastCharTime = 0;

      function tick() {
        if (!connected) return;
        requestAnimationFrame(tick);
        if (!head) return;

        agentAnalyser.getByteFrequencyData(freqData);
        let sum = 0;
        for (let i = 2; i < 30; i++) sum += freqData[i];
        const level = sum / 28 / 255;

        const isSpeaking = level > 0.015;

        if (isSpeaking) {
          // Pick up new lipsync data from queue if we need it
          if (!currentData && lipsyncQueue.length > 0) {
            currentData = lipsyncQueue.shift();
            playStartTime = performance.now();
            wordIdx = 0;
            charIdx = 0;
            lastCharTime = 0;
          }

          if (currentData) {
            const elapsed = performance.now() - playStartTime;
            const { words, wtimes, wdurations } = currentData;

            // Advance to the correct word based on elapsed time
            while (wordIdx < words.length && elapsed > wtimes[wordIdx] + wdurations[wordIdx]) {
              wordIdx++;
              charIdx = 0;
            }

            if (wordIdx < words.length) {
              const word = words[wordIdx].toLowerCase().replace(/[^a-z]/g, '');
              const wStart = wtimes[wordIdx];
              const wDur = wdurations[wordIdx];

              if (word.length > 0) {
                const charDur = wDur / word.length;
                const wordElapsed = elapsed - wStart;
                const targetChar = Math.min(Math.floor(wordElapsed / charDur), word.length - 1);

                if (targetChar >= 0 && targetChar !== charIdx) {
                  charIdx = targetChar;
                }

                const ch = word[Math.max(0, charIdx)] || '';
                const vis = charViseme[ch] || 'sil';

                allVis.forEach(v => head.setValue('viseme_' + v, 0));
                head.setValue('viseme_' + vis, 0.35);
                head.setValue('jawOpen', Math.min(level * 2, 0.3));
              }
            } else {
              // Finished this lipsync data
              currentData = null;
            }
          } else {
            // No lipsync data — simple jaw movement from audio
            head.setValue('jawOpen', Math.min(level * 1.5, 0.25));
          }
        } else {
          // Silent
          head.setValue('jawOpen', 0);
          allVis.forEach(v => head.setValue('viseme_' + v, 0));

          // If we were playing lipsync and audio stopped, check if done
          if (currentData) {
            const elapsed = performance.now() - playStartTime;
            const { wtimes, wdurations } = currentData;
            const lastEnd = wtimes[wtimes.length - 1] + wdurations[wdurations.length - 1];
            if (elapsed > lastEnd + 300) {
              currentData = null;
            }
          }
        }
      }
      tick();
    }

    function queueLipsync(data) {
      lipsyncQueue.push(data);
    }

    // ── Helpers ──
    function addMsg(role, text, segId) {
      const empty = document.querySelector('.chat-empty');
      if (empty) empty.remove();
      const div = document.createElement('div');
      if (segId) div.id = 'seg-' + segId;
      div.className = 'msg ' + role;
      const charName = (CHARACTERS[selectedChar] || CHARACTERS.lisa).name;
      const av = role === 'user' ? 'U' : charName[0].toUpperCase();
      div.innerHTML = `<span class="av">${av}</span><div class="bubble"><span class="t">${text}</span></div>`;
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
    }


    window.clearChat = () => {
      transcript.innerHTML = '<div class="chat-empty" id="emptyState">Start a conversation</div>';
    };

    // ── Avatar controls ──
    window.setMood = (mood) => {
      if (!head) return;
      try { head.setMood(mood); } catch (e) { console.warn('setMood:', e); }
      // Update active button
      document.querySelectorAll('.ctrl-group:first-child .ctrl-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.toLowerCase() === mood);
      });
    };

    window.doGesture = (name) => {
      if (!head) return;
      try { head.playGesture(name, 3, false, 1000); } catch (e) { console.warn('gesture:', e); }
    };

    const POSES = new Set(['side','hip','turn','bend','back','straight','wide','oneknee','kneel','sitting']);
    window.doPose = (name) => {
      if (!head || !POSES.has(name)) { console.warn('unknown pose:', name); return; }
      const tpl = head.poseTemplates && head.poseTemplates[name];
      if (!tpl) { console.warn('pose template missing:', name); return; }
      try { head.setPoseFromTemplate(tpl, 2000); } catch (e) { console.warn('pose:', e); }
    };

    window.setAvatarView = (view) => {
      if (!head) return;
      try { head.setView(view); } catch (e) { console.warn('setView:', e); }
      document.querySelectorAll('.ctrl-group:last-child .ctrl-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.toLowerCase() === view ||
          (b.textContent === 'Face' && view === 'head'));
      });
    };

    // Score-based mood/gesture detection. Each label gets points for keyword
    // hits + punctuation/emoji bonuses. Highest score wins. Falls back when
    // the agent didn't emit an explicit [mood:X]/[gesture:Y] tag.
    const MOOD_KEYWORDS = {
      love:  /\b(love|loved|adore|heart|sweet|cute|beautiful|gorgeous|amazing|wonderful|precious|darling|amour|aime|habibi)\b|❤|🥰|😍|💕/i,
      sad:   /\b(sorry|sad|sadly|unfortunately|bad news|miss you|lonely|cry|crying|hurt|hurts|tough|sucks|ugh|triste|désolé|حزين|آسف)\b|😢|😭|💔|😞/i,
      angry: /\b(angry|mad|annoyed|frustrated|hate|terrible|awful|ridiculous|pissed|énervé|fâché|غاضب)\b|😡|🤬|😤/i,
      fear:  /\b(afraid|scared|scary|worried|nervous|anxious|panic|yikes|peur|خائف)\b|😨|😱|😰/i,
      sleep: /\b(bye|goodbye|goodnight|night night|sleep|sleepy|tired|exhausted|bonne nuit|تصبح على خير)\b|😴|💤|🥱/i,
      happy: /\b(great|awesome|happy|glad|nice|good|cool|sweet|haha|lol|yay|hi|hey|hello|welcome|thanks|thank|love it|génial|super|merci|bien|سعيد|ممتاز|مرحبا)\b|😀|😄|😊|🙂|😁|😎|🎉/i,
    };

    const GESTURE_KEYWORDS = {
      shrug:   /\b(don't know|dunno|not sure|no idea|whatever|maybe|i guess|qui sait|ما أدري)\b/i,
      thumbup: /\b(yes|yep|yeah|yup|correct|right|exactly|perfect|nailed it|sounds good|sure|absolutely|true|makes sense|i agree|for sure|of course|definitely|oui|نعم|تمام)\b|👍/i,
      thumbdown:/\b(nope|no way|never|terrible|awful|bad idea|don't like|absolutely not|impossible)\b|👎/i,
      handup:  /\b(hi|hello|hey|hiya|wave|waving|bye|goodbye|see ya|salut|bonjour|مرحبا|مع السلامة)\b|👋/i,
      ok:      /\b(ok|okay|fine|alright|all right|got it|d'accord|تمام)\b|👌/i,
      namaste: /\b(thank|thanks|grateful|appreciate|much obliged|merci|شكرا)\b|🙏/i,
      index:   /\b(look|notice|check this|by the way|fyi|here|important|remember)\b|☝/i,
      side:    /\b(hmm|hmmm|let me think|interesting|wait what|really\?)\b/i,
    };

    function pickByScore(text, table) {
      const t = text.toLowerCase();
      let best = null, bestScore = 0;
      for (const [label, re] of Object.entries(table)) {
        const matches = t.match(new RegExp(re.source, re.flags + (re.flags.includes('g') ? '' : 'g')));
        const score = matches ? matches.length : 0;
        if (score > bestScore) { best = label; bestScore = score; }
      }
      return best;
    }

    function detectMood(text) {
      const m = pickByScore(text, MOOD_KEYWORDS);
      if (m) return m;
      // Punctuation cues
      if (/!{2,}|🎉|❗/.test(text)) return 'happy';
      return null;
    }

    function detectGesture(text) {
      return pickByScore(text, GESTURE_KEYWORDS);
    }

    // Subtle idle micro-gestures so Lisa doesn't feel frozen between turns.
    // Fires only when she's been silent for a while and isn't actively speaking.
    const IDLE_GESTURES = ['side', 'index', 'ok'];
    setInterval(() => {
      if (!head || !connected) return;
      const silentMs = Date.now() - lastAgentTextAt;
      if (silentMs < 6000) return;                 // only when idle ≥ 6s
      if (Math.random() > 0.25) return;            // ~25% chance per tick
      const g = IDLE_GESTURES[Math.floor(Math.random() * IDLE_GESTURES.length)];
      try { head.playGesture(g, 1.5, false, 800); } catch {}
    }, 4000);

    function setM(id, val, g, o) {
      const el = document.getElementById(id);
      if (!el || val == null) return;
      el.textContent = val + 'ms';
      el.className = 'metric-value ' + (val <= g ? 'good' : val <= o ? 'ok' : 'slow');
    }
  </script>
</body>
</html>
