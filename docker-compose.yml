services:
  livekit-server:
    image: livekit/livekit-server
    container_name: livekit-server
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command: --dev --bind 0.0.0.0 --node-ip 0.0.0.0
    networks:
      - avatar-network

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "8880:8880"
    environment:
      # ONNX CPU optimization (4 performance cores on M4 Pro)
      - ONNX_NUM_THREADS=4
      - ONNX_INTER_OP_THREADS=2
      - ONNX_EXECUTION_MODE=parallel
      - ONNX_OPTIMIZATION_LEVEL=all
      - ONNX_MEMORY_PATTERN=true
      - ONNX_ARENA_EXTEND_STRATEGY=kNextPowerOfTwo
      # Reduce first-chunk latency for streaming
      - TARGET_MIN_TOKENS=100
      - TARGET_MAX_TOKENS=150
      - ABSOLUTE_MAX_TOKENS=300
      # Skip text normalization overhead
      - ADVANCED_TEXT_NORMALIZATION=false
      # Reduce logging overhead
      - API_LOG_LEVEL=WARNING
    networks:
      - avatar-network

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    ports:
      - "8000:8000"
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-base
      - WHISPER__TTL=0
    # Override speaches' STT router with our patched copy that adds
    # anti-hallucination knobs (condition_on_previous_text=False, raised
    # log_prob_threshold, etc.) to the transcribe() call. See
    # patches/speaches_stt.py for the diff.
    volumes:
      - ./patches/speaches_stt.py:/home/ubuntu/speaches/src/speaches/routers/stt.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - avatar-network

  speaches-model-loader:
    image: curlimages/curl:latest
    container_name: speaches-model-loader
    depends_on:
      speaches:
        condition: service_healthy
    entrypoint: >
      sh -c 'echo "Downloading Whisper model..." &&
             curl -X POST "http://speaches:8000/v1/models/Systran/faster-whisper-base" &&
             echo "Model downloaded successfully."'
    networks:
      - avatar-network

  # Persistent memory store for the Mem0 SDK (runs embedded in the agent).
  # pgvector image = Postgres with the pgvector extension already built in.
  # No app schema is pre-created — Mem0 manages its own tables on first use.
  postgres-memory:
    image: pgvector/pgvector:pg16
    container_name: postgres-memory
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mem0
      - POSTGRES_PASSWORD=mem0
      - POSTGRES_DB=mem0
    volumes:
      - postgres-memory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - avatar-network

  agent:
    build: .
    container_name: avatar-agent
    env_file: .env
    depends_on:
      livekit-server:
        condition: service_started
      kokoro-tts:
        condition: service_started
      speaches:
        condition: service_healthy
      postgres-memory:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Cache HuggingFace embedding model across container rebuilds —
      # without this, every `docker-compose up --build` re-downloads
      # the sentence-transformers weights (~130 MB).
      - hf-cache:/root/.cache/huggingface
    networks:
      - avatar-network

  # Orpheus TTS used to live here as three Docker services
  # (orpheus-tts, orpheus-llama-cpp, orpheus-model-init). It now runs
  # natively on the host via mlx-audio so it can use Metal end-to-end.
  # Bring it up with: ORPHEUS=1 ./run.sh start
  # The agent reaches it at http://host.docker.internal:5005.

networks:
  avatar-network:
    name: avatar-network
    driver: bridge

volumes:
  postgres-memory-data:
  hf-cache:
