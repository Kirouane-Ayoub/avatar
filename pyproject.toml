[project]
name = "avatar-voice-agent"
version = "0.1.0"
description = "Local speech-to-speech voice agent using LiveKit + Kokoro TTS + Faster Whisper + Qwen"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.3,<2.0",
    "livekit-plugins-openai>=1.3,<2.0",
    "livekit-plugins-silero>=1.3,<2.0",
    "python-dotenv",
    "numpy",
    "soundfile",
    "aiohttp",
    # Persistent per-user memory. Embedded SDK (no separate REST server).
    # Talks to postgres-memory + OpenAI-compatible endpoints for both
    # fact-extraction LLM and embeddings (Ollama on the host by default).
    # NB: NO sentence-transformers / torch deps — embeddings happen out-
    # of-process at Ollama, so the agent container stays lean (~420 MB
    # of torch wheels NOT downloaded).
    "mem0ai",
    # Mem0's pgvector adapter imports psycopg_pool.ConnectionPool — that
    # comes from the [pool] extra. The [binary] extra gets the C bindings.
    # Both required; without [pool] Mem0 silently falls back to NullProvider
    # at startup with an ImportError logged.
    "psycopg[binary,pool]",
    # Auth: bcrypt for password hashing, pyjwt for session tokens.
    "bcrypt",
    "pyjwt",
]

[tool.setuptools]
# Top-level modules that live directly under src/ (entrypoint, shared
# vocabulary, CLI helpers, function tools).
py-modules = [
    "agent",
    "config",
    "cues",
    "gen_token",
    "tools",
]
# Sub-packages under src/. Each has __init__.py re-exporting its public
# API so importers do `from auth import X` instead of reaching into
# submodules.
packages = [
    "auth",
    "llm",
    "memory",
    "tts",
    "vision",
]
package-dir = {"" = "src"}
