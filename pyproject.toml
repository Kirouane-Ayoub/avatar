[project]
name = "livekit-voice-agent"
version = "0.1.0"
description = "Local speech-to-speech voice agent using LiveKit + Orpheus TTS + Faster Whisper + Gemma"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.3,<2.0",
    "livekit-plugins-openai>=1.3,<2.0",
    "livekit-plugins-silero>=1.3,<2.0",
    "snac",
    "numpy",
    "soundfile",
    "aiohttp",
]

[tool.setuptools]
py-modules = ["agent", "orpheus_tts"]
